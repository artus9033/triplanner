# Installed by `pnpm install` (lefthook's postinstall). See https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: typecheck
      run: pnpm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
